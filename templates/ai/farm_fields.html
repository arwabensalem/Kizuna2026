<div class="row g-2">
  <div class="col-6">
    <label class="form-label" for="{{ prefix }}-moisture">Soil moisture (%)</label>
    <input class="form-control" id="{{ prefix }}-moisture" name="soil_moisture" type="number" min="0" max="100" step="0.1" value="40" required>
  </div>
  <div class="col-6">
    <label class="form-label" for="{{ prefix }}-temperature">Temperature (°C)</label>
    <input class="form-control" id="{{ prefix }}-temperature" name="temperature" type="number" min="-5" max="55" step="0.1" value="30" required>
  </div>
  <div class="col-6">
    <label class="form-label" for="{{ prefix }}-humidity">Humidity (%)</label>
    <input class="form-control" id="{{ prefix }}-humidity" name="humidity" type="number" min="0" max="100" step="0.1" value="45" required>
  </div>
  <div class="col-6">
    <label class="form-label" for="{{ prefix }}-rainfall">Rainfall (mm)</label>
    <input class="form-control" id="{{ prefix }}-rainfall" name="rainfall" type="number" min="0" max="200" step="0.1" value="0" required>
  </div>
  <div class="col-6">
    <label class="form-label" for="{{ prefix }}-crop">Crop type</label>
    <select class="form-select" id="{{ prefix }}-crop" name="crop_type">
      {% for crop in crops %}
        <option value="{{ crop }}" {% if crop == "olive" %}selected{% endif %}>{{ crop }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6">
    <label class="form-label" for="{{ prefix }}-soil">Soil type</label>
    <select class="form-select" id="{{ prefix }}-soil" name="soil_type">
      {% for soil in soils %}
        <option value="{{ soil }}" {% if soil == "loam" %}selected{% endif %}>{{ soil }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12">
    <label class="form-label" for="{{ prefix }}-area">Area (m²)</label>
    <input class="form-control" id="{{ prefix }}-area" name="area" type="number" min="1" max="1000000" step="1" value="1000" required>
  </div>
</div>
